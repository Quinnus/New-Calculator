<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A retro LCD-style calculator." />
        <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link href="index.css" rel="stylesheet" />

        <title>Calculator</title>
    </head>
    <body>
        <header>
            <label class="theme-toggle" title="Toggle light/dark mode">
                <span class="toggle-icon" aria-hidden="true">☾</span>
                <input type="checkbox" id="theme-checkbox" aria-label="Light mode" />
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                <span class="toggle-icon" aria-hidden="true">☀︎</span>
            </label>
        </header>
        <main>
            <section class="calculator" aria-label="Calculator">
                <div class="all-keys" id="all-keys">
                    <div class="power">
                        <button id="power-button" class="red-key" data-key="power" aria-label="Power" aria-pressed="false">⏻</button>
                    </div>
                    <div class="display-area">
                        <div class="lcd-burn" aria-hidden="true">888888888888</div>
                        <div class="lcd-real" id="lcd-real" role="status" aria-live="polite"></div>
                    </div>
                    <div class="operator" id="key-plus">
                        <button data-key="+" aria-label="Plus">+</button>
                    </div>
                    <div class="operator" id="key-minus">
                        <button data-key="-" aria-label="Minus">-</button>
                    </div>
                    <div class="operator" id="key-multiply">
                        <button data-key="*" aria-label="Multiply">×</button>
                    </div>
                    <div class="operator" id="key-divide">
                        <button data-key="/" aria-label="Divide">÷</button>
                    </div>
                    <div class="digit" id="key-1">
                        <button data-key="1">1</button>
                    </div>
                    <div class="digit" id="key-2">
                        <button data-key="2">2</button>
                    </div>
                    <div class="digit" id="key-3">
                        <button data-key="3">3</button>
                    </div>
                    <div class="digit" id="key-4">
                        <button data-key="4">4</button>
                    </div>
                    <div class="digit" id="key-5">
                        <button data-key="5">5</button>
                    </div>
                    <div class="digit" id="key-6">
                        <button data-key="6">6</button>
                    </div>
                    <div class="digit" id="key-7">
                        <button data-key="7">7</button>
                    </div>
                    <div class="digit" id="key-8">
                        <button data-key="8">8</button>
                    </div>
                    <div class="digit" id="key-9">
                        <button data-key="9">9</button>
                    </div>
                    <div class="clear-screen">
                        <button data-key="clear" aria-label="Clear">C</button>
                    </div>
                    <div class="digit" id="key-0">
                        <button data-key="0">0</button>
                    </div>
                    <div class="decimal-point">
                        <button data-key="." aria-label="Decimal point">.</button>
                    </div>
                    <div class="sign-toggle">
                        <button data-key="sign" aria-label="Change sign">+/-</button>
                    </div>
                    <div class="backspace">
                        <button data-key="backspace" aria-label="Backspace">⌫</button>
                    </div>
                    <div class="equals-button">
                        <button data-key="=" aria-label="Equals">=</button>
                    </div>
                </div>
            </section>
        </main>
        <script src="index.js" defer></script>
    </body>
</html>
